apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  labels:
    app: {{ .Values.name }}
    app-group: epic-app
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
        app-group: epic-app
        environment: {{ .Values.env }}
    spec:
      containers:
        - name: {{ .Values.name }}
          image: image-registry.openshift-image-registry.svc:5000/{{ .Values.imageNamespace }}/{{ .Values.name }}:{{ .Values.imageTag }}
          ports:
            - containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: cron-config
              readOnly: true
              mountPath: /epic-cron/cron/
          env:
            - name: TRACK_DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: epictrack-patroni
                  key: app-db-username
            - name: TRACK_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: epictrack-patroni
                  key: app-db-password
            - name: TRACK_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: epictrack-patroni
                  key: app-db-name
            - name: TRACK_DATABASE_HOST
              value: "{{ .Values.TRACK.database.host }}"
            - name: TRACK_DATABASE_PORT
              value: "{{ .Values.TRACK.database.port }}"

            - name: SUBMIT_DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.name }}
                  key: SUBMIT_DATABASE_USERNAME
            - name: SUBMIT_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.name }}
                  key: SUBMIT_DATABASE_PASSWORD
            - name: SUBMIT_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.name }}
                  key: SUBMIT_DATABASE_NAME
            - name: SUBMIT_DATABASE_HOST
              value: "{{ .Values.SUBMIT.database.host }}"
            - name: SUBMIT_DATABASE_PORT
              value: "{{ .Values.SUBMIT.database.port }}"

            - name: COMPLIANCE_DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: compliance-patroni
                  key: app-db-username
            - name: COMPLIANCE_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: compliance-patroni
                  key: app-db-password
            - name: COMPLIANCE_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: compliance-patroni
                  key: app-db-name
            - name: COMPLIANCE_DATABASE_HOST
              value: "{{ .Values.COMPLIANCE.database.host }}"
            - name: COMPLIANCE_DATABASE_PORT
              value: "{{ .Values.COMPLIANCE.database.port }}"

            - name: CENTRE_DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.name }}
                  key: CENTRE_DATABASE_USERNAME
            - name: CENTRE_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.name }}
                  key: CENTRE_DATABASE_PASSWORD
            - name: CENTRE_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.name }}
                  key: CENTRE_DATABASE_NAME
            - name: CENTRE_DATABASE_HOST
              value: "{{ .Values.CENTRE.database.host }}"
            - name: CENTRE_DATABASE_PORT
              value: "{{ .Values.CENTRE.database.port }}"

            - name: CHES_TOKEN_ENDPOINT
              value: "{{ .Values.CHES.tokenEndpoint }}"
            - name: CHES_BASE_URL
              value: "{{ .Values.CHES.apiEndpoint }}"
            - name: CHES_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.name }}
                  key: CHES_CLIENT_ID
            - name: CHES_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.name }}
                  key: CHES_CLIENT_SECRET

            - name: WEB_URL
              value: "{{ .Values.SUBMIT.web.url }}"
            - name: SENDER_EMAIL
              value: "{{ .Values.SUBMIT.sender.email }}"
            - name: STAFF_SUPPORT_MAIL_ID
              value: "{{ .Values.SUBMIT.staffSupportMailId }}"

            - name: KEYCLOAK_BASE_URL
              value: "https://dev.loginproxy.gov.bc.ca/auth"
            - name: KEYCLOAK_REALM_NAME
              value: "eao-epic"
            - name: SERVICE_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.name }}
                  key: SERVICE_ACCOUNT_ID
            - name: SERVICE_ACCOUNT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.name }}
                  key: SERVICE_ACCOUNT_SECRET
            - name: CONNECT_TIMEOUT
              value: "60"

            - name: CONDITION_API_BASE_URL
              value: "https://epic-dev.apps.silver.devops.gov.bc.ca/api/v1/condition"

          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
          terminationMessagePath: "/dev/termination-log"
          terminationMessagePolicy: File
          imagePullPolicy: Always
      volumes:
        - name: cron-config
          configMap:
            name: {{ .Values.name }}-config
            defaultMode: 420
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      schedulerName: default-scheduler
