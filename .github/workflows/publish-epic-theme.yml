name: Validate and release epic.theme

on:
  pull_request:
    paths: ["epic.theme/**", ".github/workflows/publish-epic-theme.yml"]
  push:
    branches: [main]
    tags: ["epic-theme-v2.*"]
    paths: ["epic.theme/**", ".github/workflows/publish-epic-theme.yml"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to publish (leave empty to validate only)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

defaults:
  run:
    working-directory: epic.theme

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check manual release request
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        shell: bash
        working-directory: .
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "Run a manual release from main so it uses the reviewed publishing workflow."
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^epic-theme-v2\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Enter an existing tag such as epic-theme-v2.0.0."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          fetch-depth: 0
      - name: Check release source
        if: startsWith(github.ref, 'refs/tags/epic-theme-v2.') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main
          node scripts/check-release.mjs "$RELEASE_TAG"
      - uses: actions/setup-node@v4
        with:
          node-version-file: epic.theme/.nvmrc
          cache: npm
          cache-dependency-path: epic.theme/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:package
      - name: Pack the validated release
        run: npm pack --json > pack-metadata.json
      - uses: actions/upload-artifact@v4
        with:
          name: epic-theme-package
          path: |
            epic.theme/epic.theme-*.tgz
            epic.theme/pack-metadata.json

  publish:
    if: startsWith(github.ref, 'refs/tags/epic-theme-v2.') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: validate
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: epic-theme-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: epic.theme/.nvmrc
          registry-url: https://registry.npmjs.org
      - name: Use npm with trusted publishing support
        run: npm install --global npm@11.11.0
      - uses: actions/download-artifact@v4
        with:
          name: epic-theme-package
          path: epic.theme
      - name: Publish the validated artifact on its isolated channel
        run: |
          channel=$(node scripts/check-release.mjs "$RELEASE_TAG")
          npm view epic.theme dist-tags --json > tags-before.json
          tarball=$(node -p "JSON.parse(require('fs').readFileSync('pack-metadata.json', 'utf8'))[0].filename")
          npm publish "./$tarball" --tag "$channel" --access public
          npm view epic.theme dist-tags --json > tags-after.json
          node --input-type=module - <<'JS'
          import { readFileSync } from 'node:fs';
          const before = JSON.parse(readFileSync('tags-before.json', 'utf8'));
          const after = JSON.parse(readFileSync('tags-after.json', 'utf8'));
          if (before.latest !== after.latest) throw new Error('latest changed; investigate without automatically overwriting another release.');
          JS
