name: Validate and release epic.theme

on:
  pull_request:
    paths: ["epic.theme/**", ".github/workflows/publish-epic-theme.yml"]
  push:
    branches: [main]
    tags: ["epic-theme-v2.*"]
    paths: ["epic.theme/**", ".github/workflows/publish-epic-theme.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: epic.theme

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: epic.theme/.nvmrc
          cache: npm
          cache-dependency-path: epic.theme/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:package
      - name: Pack the validated release
        run: npm pack --json > pack-metadata.json
      - uses: actions/upload-artifact@v4
        with:
          name: epic-theme-package
          path: |
            epic.theme/epic.theme-*.tgz
            epic.theme/pack-metadata.json

  publish:
    if: startsWith(github.ref, 'refs/tags/epic-theme-v2.')
    needs: validate
    runs-on: ubuntu-latest
    environment: npm
    concurrency:
      group: epic-theme-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: epic.theme/.nvmrc
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: epic-theme-package
          path: epic.theme
      - name: Publish the validated artifact on its isolated channel
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          channel=$(node scripts/check-release.mjs)
          npm view epic.theme dist-tags --json > tags-before.json
          tarball=$(node -p "JSON.parse(require('fs').readFileSync('pack-metadata.json', 'utf8'))[0].filename")
          npm publish "./$tarball" --tag "$channel" --access public
          npm view epic.theme dist-tags --json > tags-after.json
          node --input-type=module - <<'JS'
          import { readFileSync } from 'node:fs';
          const before = JSON.parse(readFileSync('tags-before.json', 'utf8'));
          const after = JSON.parse(readFileSync('tags-after.json', 'utf8'));
          if (before.latest !== after.latest) throw new Error('latest changed; investigate without automatically overwriting another release.');
          JS
